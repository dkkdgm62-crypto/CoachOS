<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoachOS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9;--surface:#FFFFFF;--surface2:#F0F2F6;--border:#E2E6EE;
  --text:#0F172A;--text2:#5A6478;--text3:#9CA3AF;
  --accent:#1B4FDB;--accent-l:#EBF0FF;--accent-d:#1340B8;
  --green:#16A34A;--green-l:#DCFCE7;
  --red:#DC2626;--red-l:#FEE2E2;
  --orange:#EA580C;--orange-l:#FFF3EB;
  --gold:#D97706;--gold-l:#FEF3C7;
  --sw:252px;--hh:58px;--r:10px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  --sh2:0 8px 32px rgba(0,0,0,.10);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh;}
.hidden{display:none!important;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ── LOGIN ── */
#ls{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,#050E25 0%,#0D2563 55%,#1B4FDB 100%);
  position:relative;overflow:hidden;}
#ls::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(27,79,219,.25) 0%,transparent 70%);
  top:-100px;right:-100px;}
#ls::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(22,163,74,.12) 0%,transparent 70%);
  bottom:-80px;left:-80px;}
.lc{background:#fff;border-radius:16px;padding:36px;width:100%;max-width:400px;
  position:relative;z-index:1;box-shadow:0 32px 80px rgba(0,0,0,.35);}
.ll{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
.li{width:38px;height:38px;background:var(--accent);border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:800;color:#fff;font-size:17px;}
.lt{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:20px;}
.lt span{color:var(--accent);}
.lh{font-size:17px;font-weight:700;margin-bottom:4px;}
.ls2{color:var(--text2);font-size:12px;margin-bottom:24px;}
.db{padding:11px 14px;border-radius:8px;border:1.5px solid var(--border);
  cursor:pointer;background:#fff;transition:all .15s;
  display:flex;align-items:center;gap:12px;margin-bottom:8px;width:100%;text-align:left;}
.db:hover{border-color:var(--accent);background:var(--accent-l);}
.db .ri{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.db .rl{font-weight:700;font-size:13px;}
.db .rd{font-size:11px;color:var(--text2);}

/* ── SHELL ── */
#app{display:flex;min-height:100vh;}
.sb{width:var(--sw);background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:100;
  transition:left .2s;}
.sb.right{left:auto;right:0;border-right:none;border-left:1px solid var(--border);}
.sb-head{padding:0 16px;height:var(--hh);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;}
.sb-logo{width:30px;height:30px;background:var(--accent);border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:800;color:#fff;font-size:13px;flex-shrink:0;}
.sb-lt{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:15px;}
.sb-lt span{color:var(--accent);}

/* Verein-Box in Sidebar */
.vb{margin:10px;border-radius:9px;overflow:hidden;}
.vb-inner{padding:10px 12px;background:var(--accent-l);display:flex;align-items:center;gap:10px;}
.vb-logo{width:36px;height:36px;border-radius:7px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;
  overflow:hidden;flex-shrink:0;}
.vb-logo img{width:100%;height:100%;object-fit:cover;}
.vb-name{font-weight:700;font-size:12px;color:var(--accent);}
.vb-sub{font-size:10px;color:var(--text2);}

.sbn{flex:1;overflow-y:auto;padding:8px;}
.ns{margin-bottom:2px;}
.nl{padding:9px 8px 3px;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;
  cursor:pointer;transition:all .12s;color:var(--text2);font-weight:500;font-size:13px;margin-bottom:1px;}
.ni:hover{background:var(--surface2);color:var(--text);}
.ni.active{background:var(--accent-l);color:var(--accent);font-weight:600;}
.ni .ic{font-size:15px;width:18px;text-align:center;}
.ni .nb{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;
  padding:1px 5px;font-size:10px;font-weight:700;}
.sb-foot{padding:10px;border-top:1px solid var(--border);}
.uc{display:flex;align-items:center;gap:9px;padding:7px;border-radius:7px;cursor:pointer;}
.uc:hover{background:var(--surface2);}
.ua{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0;}
.un{font-size:12px;font-weight:600;}
.ur{font-size:10px;color:var(--text2);}

/* ── MAIN ── */
.main{flex:1;margin-left:var(--sw);display:flex;flex-direction:column;min-height:100vh;}
.main.sr{margin-left:0;margin-right:var(--sw);}
.tb{height:var(--hh);background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;}
.tb-t{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;}
.tb-a{display:flex;align-items:center;gap:8px;}
.btn{padding:6px 13px;border-radius:7px;font-size:12px;font-weight:600;
  cursor:pointer;border:none;transition:all .12s;display:inline-flex;align-items:center;gap:5px;}
.btn-o{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.btn-o:hover{border-color:var(--accent);color:var(--accent);}
.btn-b{background:var(--accent);color:#fff;}
.btn-b:hover{background:var(--accent-d);}
.btn-g{background:var(--green);color:#fff;}
.btn-r{background:var(--red);color:#fff;}
.btn-sm{padding:4px 9px;font-size:11px;}
.pc{padding:20px;}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);}
.ch{padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;}
.ct{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;}
.cb{padding:18px;}

/* ── BADGE ── */
.bdg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;}
.bdg-b{background:var(--accent-l);color:var(--accent);}
.bdg-g{background:var(--green-l);color:var(--green);}
.bdg-r{background:var(--red-l);color:var(--red);}
.bdg-o{background:var(--orange-l);color:var(--orange);}
.bdg-gold{background:var(--gold-l);color:var(--gold);}

/* ── DASHBOARD ── */
.dg{display:grid;gap:14px;}
.sr4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--sh);}
.sv{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:800;margin:4px 0 2px;}
.sl{font-size:11px;color:var(--text2);}
.sd{font-size:11px;font-weight:600;margin-top:4px;}
.sd.up{color:var(--green);}
.sd.warn{color:var(--orange);}

/* ── KALENDER ── */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.ch2{text-align:center;font-size:10px;font-weight:700;color:var(--text3);padding:5px 0;}
.cd{min-height:52px;border-radius:6px;padding:4px;cursor:pointer;transition:background .1s;
  position:relative;font-size:11px;font-weight:600;}
.cd:hover{background:var(--surface2);}
.cd.today{background:var(--accent);color:#fff;}
.cd.today .cd-num{color:#fff;}
.cd-num{font-size:12px;font-weight:700;display:block;margin-bottom:2px;}
.cd.om .cd-num{color:var(--text3);}
.ev-dot{font-size:9px;font-weight:700;padding:1px 3px;border-radius:3px;display:inline-block;margin-top:1px;line-height:1.3;}
.ev-ms{background:#1B4FDB;color:#fff;}
.ev-ts{background:#16A34A;color:#fff;}
.ev-tu{background:#EA580C;color:#fff;}

/* ── NEXT GAMES ── */
.ng{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.ng:last-child{border-bottom:none;}
.nd{width:42px;height:46px;border-radius:8px;background:var(--accent-l);
  display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.ndd{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:800;color:var(--accent);}
.ndm{font-size:9px;font-weight:700;color:var(--text2);text-transform:uppercase;}
.nv{font-weight:700;font-size:13px;}
.nm{font-size:11px;color:var(--text2);margin-top:1px;}

/* ── SPIELER ── */
.pr{display:grid;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);}
.pr:last-child{border-bottom:none;}
.pav{width:32px;height:32px;border-radius:7px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
  color:var(--text2);overflow:hidden;flex-shrink:0;}
.pav img{width:100%;height:100%;object-fit:cover;}
.pn{font-weight:600;font-size:13px;}
.pp{font-size:11px;color:var(--text2);}
.rp{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:12px;}
.rh{background:#DCFCE7;color:#16A34A;}
.rm2{background:#FEF3C7;color:#D97706;}
.rl{background:#FEE2E2;color:#DC2626;}

/* ── SPIELFELD ── */
.field-wrap{position:relative;width:100%;max-width:340px;margin:0 auto;
  background:linear-gradient(180deg,#2A6B35 0%,#2E7A3C 50%,#2A6B35 100%);
  border-radius:8px;overflow:hidden;}
.field-wrap::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0px,rgba(255,255,255,.03) 1px,transparent 1px,transparent 40px);}
.fw7{aspect-ratio:.62;}
.fw9{aspect-ratio:.62;}
.fw11{aspect-ratio:.62;}
.fl{position:absolute;background:rgba(255,255,255,.3);}
.fc{position:absolute;border:1px solid rgba(255,255,255,.3);background:transparent;border-radius:50%;}
/* Mittellinig */
.fl-mid{top:50%;left:5%;right:5%;height:1px;}
.fc-mid{width:15%;padding-top:15%;top:50%;left:50%;transform:translate(-50%,-50%);}
/* Strafraumlinie 7er = Abseitsregel */
.fl-pen-t{top:22%;left:15%;right:15%;height:2px;background:rgba(255,200,0,.6);}
.fl-pen-b{bottom:22%;left:15%;right:15%;height:2px;background:rgba(255,200,0,.6);}
.fl-offs-label-t{position:absolute;top:23%;left:16%;font-size:8px;color:rgba(255,220,0,.9);font-weight:700;}
.fl-offs-label-b{position:absolute;bottom:23%;left:16%;font-size:8px;color:rgba(255,220,0,.9);font-weight:700;}
/* Tore */
.fl-goal-t{top:0;left:35%;right:35%;height:4%;background:rgba(255,255,255,.5);border-bottom:1px solid rgba(255,255,255,.6);}
.fl-goal-b{bottom:0;left:35%;right:35%;height:4%;background:rgba(255,255,255,.5);border-top:1px solid rgba(255,255,255,.6);}
/* Außenlinien */
.fl-out-l{top:0;bottom:0;left:5%;width:1px;}
.fl-out-r{top:0;bottom:0;right:5%;width:1px;}
.fl-out-t{top:0;left:5%;right:5%;height:1px;}
.fl-out-b{bottom:0;left:5%;right:5%;height:1px;}
/* Penalty box normal */
.fl-pb-t{top:0;left:25%;right:25%;height:14%;background:transparent;border:1px solid rgba(255,255,255,.3);border-top:none;}
.fl-pb-b{bottom:0;left:25%;right:25%;height:14%;background:transparent;border:1px solid rgba(255,255,255,.3);border-bottom:none;}

.fp{position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:grab;user-select:none;z-index:10;}
.fp:active{cursor:grabbing;z-index:20;}
.fd{width:32px;height:32px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:9px;color:var(--accent);
  box-shadow:0 2px 8px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.9);
  transition:transform .1s;pointer-events:none;}
.fp:hover .fd{transform:scale(1.1);}
.fd.k{background:var(--gold);color:#fff;}
.fd.s{background:var(--orange);color:#fff;}
.fn{font-size:8px;font-weight:700;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.8);
  background:rgba(0,0,0,.45);padding:1px 3px;border-radius:3px;
  white-space:nowrap;pointer-events:none;}

/* ── BEWERTUNG ── */
.bw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bw-item{background:var(--surface2);border-radius:8px;padding:12px;}
.bw-lbl{font-size:10px;font-weight:700;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
.bw-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:4px;}
.bw-fill{height:100%;border-radius:3px;transition:width .5s;}
.bw-fill.h{background:var(--green);}
.bw-fill.m{background:var(--gold);}
.bw-fill.l{background:var(--red);}
.bw-val{font-size:18px;font-weight:800;font-family:'Space Grotesk',sans-serif;}
.bw-kom{margin-top:6px;}
.bw-kom textarea{width:100%;padding:5px 7px;border:1.5px solid var(--border);
  border-radius:6px;font-size:11px;resize:vertical;min-height:40px;
  background:var(--surface);font-family:inherit;color:var(--text);}
.bw-kom textarea:focus{outline:none;border-color:var(--accent);}

/* ── MAKROZYKLUS ── */
.mz-phase{margin-bottom:16px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.mz-ph{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;}
.mz-ph:hover{background:var(--surface2);}
.mz-body{padding:14px;background:var(--surface);border-top:1px solid var(--border);}
.mz-zone{margin-bottom:10px;}
.mz-zt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.mz-zl{font-size:12px;color:var(--text2);margin-bottom:3px;padding-left:10px;line-height:1.5;}
.mz-zp{font-size:11px;color:var(--text2);padding-left:18px;margin-bottom:2px;
  position:relative;}
.mz-zp::before{content:'•';position:absolute;left:8px;}

/* ── TAKTIK ── */
.tk-wrap{position:relative;width:100%;
  background:linear-gradient(180deg,#2A6B35,#2E7A3C,#2A6B35);
  border-radius:10px;overflow:hidden;touch-action:none;}
.tk-wrap::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0px,rgba(255,255,255,.03) 1px,transparent 1px,transparent 38px);}
.tk-ball{position:absolute;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff 0%,#e8e8e8 60%,#ccc 100%);
  box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:grab;z-index:15;transform:translate(-50%,-50%);}
.tk-player{position:absolute;transform:translate(-50%,-50%);cursor:grab;z-index:10;}
.tk-pd{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.8);}
.tk-svg{position:absolute;inset:0;pointer-events:none;z-index:5;}
.tk-draw-canvas{position:absolute;inset:0;z-index:20;display:none;}

/* ── TABS ── */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px;}
.tab{padding:9px 15px;font-size:12px;font-weight:600;color:var(--text2);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .12s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ── OVERLAY ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;}
.bs{background:#fff;border-radius:16px 16px 0 0;padding:22px;
  width:100%;max-width:500px;max-height:80vh;overflow-y:auto;}
.bsh{width:34px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px;}
.fi{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;
  font-size:13px;font-family:inherit;outline:none;transition:border-color .1s;}
.fi:focus{border-color:var(--accent);}
.fl2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.flbl{font-size:10px;font-weight:700;color:var(--text2);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="ls">
  <div class="lc">
    <div class="ll">
      <div class="li">C</div>
      <div class="lt">Coach<span>OS</span></div>
    </div>
    <div class="lh">Willkommen zurück</div>
    <div class="ls2">Demo — Echte Anmeldung mit Supabase Auth</div>

    <!-- DEMO BANNER -->
    <div style="background:linear-gradient(135deg,#EBF0FF,#DCFCE7);border:1px solid #1B4FDB33;border-radius:8px;padding:10px 12px;margin-bottom:16px;display:flex;align-items:center;gap:8px">
      <div style="font-size:18px">🧪</div>
      <div>
        <div style="font-size:11px;font-weight:700;color:#1B4FDB">DEMO-MODUS</div>
        <div style="font-size:10px;color:#5A6478">Echte Anmeldung · Keine Daten werden gespeichert</div>
      </div>
    </div>

    <!-- ERROR BOX -->
    <div id="login-err" style="display:none;background:#FEE2E2;border:1px solid #FCA5A5;border-radius:7px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#DC2626;font-weight:600"></div>

    <!-- EMAIL/PASSWORD FORM -->
    <div id="login-form">
      <div style="margin-bottom:10px">
        <label class="flbl">E-MAIL</label>
        <input id="li-email" type="email" class="fi" placeholder="trainer@verein.ch" style="margin-top:4px" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div style="margin-bottom:14px">
        <label class="flbl">PASSWORT</label>
        <div style="position:relative;margin-top:4px">
          <input id="li-pw" type="password" class="fi" placeholder="••••••••" style="padding-right:38px" onkeydown="if(event.key==='Enter')doLogin()">
          <button onclick="togglePw()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:14px;color:var(--text2)">👁</button>
        </div>
      </div>
      <button class="btn btn-b" style="width:100%;padding:11px;font-size:13px" onclick="doLogin()" id="login-btn">
        Anmelden
      </button>
    </div>

    <!-- LOADING STATE -->
    <div id="login-loading" style="display:none;text-align:center;padding:24px">
      <div style="width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px"></div>
      <div style="font-size:12px;color:var(--text2)">Anmeldung läuft...</div>
    </div>



    <div style="margin-top:12px;text-align:center;font-size:10px;color:var(--text3)">
      CoachOS Demo · Kaplan Digital · Basel 2025
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <nav class="sb" id="sb">
    <div class="sb-head">
      <div class="sb-logo">C</div>
      <div class="sb-lt">Coach<span>OS</span></div>
    </div>
    <div class="vb" id="vb">
      <div class="vb-inner">
        <div class="vb-logo" id="vb-logo">FC</div>

// Login helpers
function setLoginLoading(on){
  document.getElementById('login-form').style.display    = on ? 'none' : '';
  document.getElementById('login-loading').style.display = on ? 'block' : 'none';
}
function showErr(msg){
  const el = document.getElementById('login-err');

async function doLogin(){
  const email = document.getElementById('li-email').value.trim();
  const pw    = document.getElementById('li-pw').value;
  document.getElementById('login-err').style.display = 'none';

  if(!email){ showErr('Bitte E-Mail eingeben.'); return; }
  if(!pw)   { showErr('Bitte Passwort eingeben.'); return; }

  const sb = getSB();
  if(!sb) return;

  setLoginLoading(true);

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });

    if(error){
      // Friendly error messages
      let msg = 'Anmeldung fehlgeschlagen.';
      if(error.message.includes('Invalid login'))  msg = '❌ Falsche E-Mail oder falsches Passwort.';
      else if(error.message.includes('Email not')) msg = '❌ E-Mail nicht bestätigt.';
      else if(error.message.includes('Too many'))  msg = '⏳ Zu viele Versuche. Bitte warten.';
      else if(error.message.includes('network'))   msg = '🌐 Netzwerkfehler. Bitte Verbindung prüfen.';
      else msg = '❌ ' + error.message;
      showErr(msg);
      return;
    }

    const user = data.user;
    // Determine role from profiles table or fallback to email mapping
    let detectedRole = DEMO_ROLES[email] || 'cheftrainer';

    try {
      const { data: profile } = await sb
        .from('profiles')
        .select('rolle, vorname, nachname')
        .eq('id', user.id)
        .single();
      if(profile?.rolle) detectedRole = profile.rolle;
    } catch(e) {
      // profiles table might not have entry yet — use demo mapping
    }

    // Sign out immediately after (DEMO MODE — no persistent session)
    await sb.auth.signOut();

    loginAs(detectedRole, user.email, user.user_metadata?.full_name || '');

  } catch(e) {
    showErr('🌐 Verbindungsfehler: ' + (e.message || 'Unbekannter Fehler'));
  }
}

function buildCal(){
  const days=['Mo','Di','Mi','Do','Fr','Sa','So'];
  let h=`<div class="cg">`;
  days.forEach(d=>h+=`<div class="ch2">${d}</div>`);
  for(let i=0;i<3;i++)h+=`<div class="cd om"><span class="cd-num">${29+i}</span></div>`;
  for(let d=1;d<=31;d++){
    const ev=CAL_EVENTS[d];
    h+=`<div class="cd${d===20?' today':''}" onclick="calClick(${d})">
      <span class="cd-num">${d}</span>
      ${ev?`<span class="ev-dot ev-${ev.type}">${ev.type.toUpperCase()}</span><div style="font-size:8px;color:${d===20?'#fff':'var(--text2)'};margin-top:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${ev.vs}</div>`:''}
    </div>`;
  }
  h+='</div>';
  return h;
}

// Drag & Drop für Aufstellung
let dragging=null,dragOffX=0,dragOffY=0;
function initDrag(){
  const field=document.querySelector('.field-wrap');
  if(!field)return;
  field.addEventListener('mousemove',onDrag);
  field.addEventListener('mouseup',stopDrag);
  field.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];onDragXY(t.clientX,t.clientY);},{passive:false});
  field.addEventListener('touchend',stopDrag);
}
function startDrag(e,el){
  e.preventDefault();dragging=el;
  const r=el.closest('.field-wrap').getBoundingClientRect();
  const er=el.getBoundingClientRect();
  dragOffX=e.clientX-er.left-er.width/2;
  dragOffY=e.clientY-er.top-er.height/2;
}
function onDrag(e){onDragXY(e.clientX,e.clientY);}
function onDragXY(cx,cy){
  if(!dragging)return;
  const field=dragging.closest('.field-wrap');
  const r=field.getBoundingClientRect();
  let x=((cx-dragOffX-r.left)/r.width)*100;
  let y=((cy-dragOffY-r.top)/r.height)*100;
  x=Math.max(5,Math.min(95,x));y=Math.max(2,Math.min(98,y));
  dragging.style.left=x+'%';dragging.style.top=y+'%';
}
function stopDrag(){dragging=null;}

}

let tkPts=[];
function tkDown(e){
  if(tkMode==='move'||tkMode==='ball')return;
  tkDrawing=true;tkPts=[];
  const r=e.currentTarget.getBoundingClientRect();
  const x=((e.clientX-r.left)/r.width)*100;
  const y=((e.clientY-r.top)/r.height)*100;
  tkPts.push({x,y});
  if(tkMode==='arrow'||tkMode==='draw'){
    const svg=document.getElementById('tk-svg');
    tkPath=document.createElementNS('http://www.w3.org/2000/svg','path');
    tkPath.setAttribute('stroke',tkCol);
    tkPath.setAttribute('stroke-width','2.5');
    tkPath.setAttribute('fill','none');
    tkPath.setAttribute('stroke-linecap','round');
    if(tkMode==='arrow'){
      tkPath.setAttribute('marker-end','url(#arrowhead)');
      if(!document.getElementById('tk-arrow-marker')){
        const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
        defs.innerHTML=`<marker id="arrowhead" markerWidth="6" markerHeight="4" refX="3" refY="2" orient="auto">
          <polygon points="0 0, 6 2, 0 4" fill="${tkCol}"/>
        </marker>`;
        svg.appendChild(defs);
      }
    }
    svg.appendChild(tkPath);
  }
}
function tkMove(e){
  if(!tkDrawing)return;
  const r=e.currentTarget.getBoundingClientRect();
  const x=((e.clientX-r.left)/r.width)*100;
  const y=((e.clientY-r.top)/r.height)*100;
  tkPts.push({x,y});
  if(tkMode==='arrow'||tkMode==='draw'){
    if(tkPath){
      const d='M'+tkPts.map(p=>`${p.x} ${p.y}`).join(' L');
      tkPath.setAttribute('d',d);
    }
  } else if(tkMode==='zone'){
    const svg=document.getElementById('tk-svg');
    if(tkPts.length>1){
      const s=tkPts[0];
      let existing=document.getElementById('tk-zone-rect');
      if(!existing){existing=document.createElementNS('http://www.w3.org/2000/svg','rect');existing.id='tk-zone-rect';svg.appendChild(existing);}
      existing.setAttribute('x',Math.min(s.x,x));
      existing.setAttribute('y',Math.min(s.y,y));
      existing.setAttribute('width',Math.abs(x-s.x));
      existing.setAttribute('height',Math.abs(y-s.y));
      existing.setAttribute('fill',tkCol+'33');
      existing.setAttribute('stroke',tkCol);
      existing.setAttribute('stroke-width','1.5');
    }
  }
}
function tkTDown(e){if(tkMode==='move'||tkMode==='ball')return;e.preventDefault();const t=e.touches[0];tkDown({currentTarget:e.currentTarget,clientX:t.clientX,clientY:t.clientY});}
function tkTMove(e){if(tkMode==='move'||tkMode==='ball')return;e.preventDefault();const t=e.touches[0];tkMove({currentTarget:e.currentTarget,clientX:t.clientX,clientY:t.clientY});}

}

// ── VEREINE / LIZENZEN ────────────────────────────────
function pVereine(el){pSuperDash(el);}
function pLiz(el){
  el.innerHTML=`
  <div class="card">
    <div class="ch"><span class="ct">🔑 Lizenzpakete</span></div>
    <div class="cb">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px">
        ${[
          {n:'Starter',t:2,l:5,p:'49'},
          {n:'Pro',t:5,l:15,p:'99'},
          {n:'Enterprise',t:15,l:'∞',p:'199'},
        ].map((l,i)=>`
        <div class="card" style="border:${i===1?'2px solid var(--accent)':'1px solid var(--border)'}">
          <div class="cb" style="text-align:center">
            <div style="font-family:'Space Grotesk';font-weight:800;font-size:16px;margin-bottom:4px">${l.n}</div>
            <div style="font-size:24px;font-weight:800;color:var(--accent)">CHF ${l.p}<span style="font-size:12px;color:var(--text2)">/Mo</span></div>
            <div style="font-size:11px;color:var(--text2);margin:8px 0">${l.t} Teams · ${l.l} Logins</div>
            <button class="btn ${i===1?'btn-b':'btn-o'} btn-sm" style="width:100%">Zuweisen</button>
          </div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}
function pSet(el){
  el.innerHTML=`
  <div class="card">
    <div class="ch"><span class="ct">⚙️ Darstellung & Präferenzen</span></div>
    <div class="cb">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)">
        <div><div style="font-weight:600">Sidebar-Position</div><div style="font-size:11px;color:var(--text2)">Für Links- oder Rechtshänder</div></div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-b btn-sm">Links</button>
          <button class="btn btn-o btn-sm" onclick="toggleSide()">Rechts</button>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)">
        <div><div style="font-weight:600">Verein-Logo hochladen</div><div style="font-size:11px;color:var(--text2)">Erscheint in Sidebar und Dashboard</div></div>
        <input type="file" accept="image/*" onchange="previewLogo(this)" style="display:none" id="logo-inp">
        <button class="btn btn-o btn-sm" onclick="document.getElementById('logo-inp').click()">📁 Logo wählen</button>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0">
        <div><div style="font-weight:600">Team wechseln</div><div style="font-size:11px;color:var(--text2)">Deine zugewiesenen Teams</div></div>
        <select class="fi" style="width:auto;font-size:12px">
          <option>FE12 Blau</option><option>FE12 Rot</option>
        </select>
      </div>
    </div>
  </div>`;
}
function previewLogo(inp){
  if(!inp.files[0])return;
  const url=URL.createObjectURL(inp.files[0]);
  const vl=document.getElementById('vb-logo');
  if(vl){vl.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:7px">`;vl.style.padding='0';}
}

// ── OVERLAYS ──────────────────────────────────────────
function showOv(html){document.getElementById('ovc').innerHTML=html;document.getElementById('ov').classList.remove('hidden');}
function closeOv(){document.getElementById('ov').classList.add('hidden');}

function showAddSp(){
  showOv(`<div style="font-weight:700;font-size:15px;margin-bottom:14px">➕ Spieler hinzufügen</div>
    <div class="fl2">
      <div><label class="flbl">VORNAME</label><input class="fi" placeholder="Vorname" style="margin-top:3px"></div>
      <div><label class="flbl">NACHNAME</label><input class="fi" placeholder="Nachname" style="margin-top:3px"></div>
      <div><label class="flbl">GEBURTSDATUM</label><input type="date" class="fi" style="margin-top:3px"></div>
      <div><label class="flbl">STARKER FUSS</label><select class="fi" style="margin-top:3px"><option>Rechts</option><option>Links</option><option>Beide</option></select></div>
      <div><label class="flbl">POSITION (HAUPT)</label><select class="fi" style="margin-top:3px">${POSITIONEN.map(p=>`<option>${p}</option>`).join('')}</select></div>
      <div><label class="flbl">POSITION ALT 1</label><select class="fi" style="margin-top:3px"><option>—</option>${POSITIONEN.map(p=>`<option>${p}</option>`).join('')}</select></div>
      <div><label class="flbl">POSITION ALT 2</label><select class="fi" style="margin-top:3px"><option>—</option>${POSITIONEN.map(p=>`<option>${p}</option>`).join('')}</select></div>

    </div>

    <input type="file" accept="image/*" class="fi" style="margin-top:3px;padding:6px"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-b" style="flex:1" onclick="closeOv()">Spieler speichern</button>
      <button class="btn btn-o" onclick="closeOv()">Abbrechen</button>
    </div>`);
}
function showSpDetail(name){
  const p=SPIELER_DATA.find(s=>s.name===name)||{name,pos:'—',min:0,tore:0,rating:0};
  showOv(`<div style="font-weight:700;font-size:15px;margin-bottom:14px">👤 ${name}</div>
    <div class="fl2" style="margin-bottom:14px">
      <div style="background:var(--surface2);border-radius:7px;padding:10px"><div style="font-size:10px;color:var(--text2)">POSITION</div><div style="font-weight:700">${p.pos}</div></div>
      <div style="background:var(--surface2);border-radius:7px;padding:10px"><div style="font-size:10px;color:var(--text2)">SPIELZEIT</div><div style="font-weight:700">${p.min} Min</div></div>
      <div style="background:var(--surface2);border-radius:7px;padding:10px"><div style="font-size:10px;color:var(--text2)">TORE</div><div style="font-weight:700">${p.tore}</div></div>
      <div style="background:var(--surface2);border-radius:7px;padding:10px"><div style="font-size:10px;color:var(--text2)">Ø BEWERTUNG</div><div style="font-weight:700;color:var(--green)">${p.rating}</div></div>

  showOv(`<div style="font-weight:700;font-size:15px;margin-bottom:14px">Position ${pos} — Spieler wählen</div>
    ${SPIELER_DATA.map(s=>`

      <button class="btn btn-b btn-sm">Wählen</button>
    </div>`).join('')}`);
}
function showNewBew(){
  showOv(`<div style="font-weight:700;font-size:15px;margin-bottom:14px">⭐ Neue Bewertung</div>
    <div style="margin-bottom:10px"><label class="flbl">QUARTAL</label>
    <select class="fi" style="margin-top:3px"><option>Q3 2025</option><option>Q2 2025</option><option>Q1 2025</option><option>Q4 2024</option></select></div>

      <textarea class="fi" style="min-height:36px;resize:vertical;font-size:11px" placeholder="Kommentar zu ${r.lb}..."></textarea>
    </div>`).join('')}
    <button class="btn btn-b" style="width:100%;margin-top:6px" onclick="closeOv()">Bewertung speichern</button>`);
}
function showSpielForm(typ){
  showOv(`<div style="font-weight:700;font-size:15px;margin-bottom:14px">📋 ${typ}</div>

function confirmDel(name){
  showOv(`<div style="text-align:center;padding:10px">
    <div style="font-size:28px;margin-bottom:10px">⚠️</div>
    <div style="font-weight:700;font-size:15px;margin-bottom:6px">Spieler löschen?</div>
    <div style="color:var(--text2);font-size:12px;margin-bottom:18px">${name} und alle Daten werden dauerhaft gelöscht.</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-r" style="flex:1" onclick="closeOv()">Löschen</button>
      <button class="btn btn-o" style="flex:1" onclick="closeOv()">Abbrechen</button>
    </div>
  </div>`);
}
function selSp(el,name){
  el.closest('.card').querySelectorAll('div[onclick]').forEach(e=>{e.style.background='';e.querySelector('.pav').style.background='';e.querySelector('.pav').style.color='';});
  el.style.background='var(--accent-l)';
  el.querySelector('.pav').style.background='var(--accent)';
  el.querySelector('.pav').style.color='#fff';
  document.querySelector('#bw-dp .ct').textContent=name+' — Q2 2025';
}
function swTab(tab,tid){
  tab.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  document.querySelectorAll('[id^="bw-"]').forEach(e=>e.classList.add('hidden'));
  const t=document.getElementById(tid);
  if(t)t.classList.remove('hidden');
}
function addMzPhase(){alert('Neue Phase hinzufügen — in der echten Version öffnet ein Formular.');}
</script>
